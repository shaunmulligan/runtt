name: CI

on:
  push:
  pull_request:

permissions:
  contents: write        # the release job needs it; nothing else does

env:
  CARGO_TERM_COLOR: always
  # Fail on warnings: this codebase currently has none, and the cheapest time to
  # keep it that way is now.
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      # The whole point of phases 0-1: the entire loop runs headless, with no
      # hardware and no USB access, so it can gate every commit.
      - name: Test
        run: cargo test --all-features --workspace

      - name: Build release binaries
        run: cargo build --release --workspace

      # A smoke test through a real container engine. podman is preinstalled on
      # GitHub's Ubuntu runners and takes --runtime=<path> with no daemon
      # config and no root, which exercises the same runc-style CLI contract
      # that containerd uses.
      - name: Smoke test through podman
        run: |
          set -euo pipefail
          # A REAL imgtool-signed image, not random bytes. The runtime parses the
          # MCUboot header and TLV digest to establish image identity, so a raw
          # binary is rejected outright with "not an MCUboot image". This block
          # used /dev/urandom until the TLV parser landed in phase 1.
          mkdir -p /tmp/fw
          cp crates/runtt-smp/tests/fixtures/app.signed.bin /tmp/fw/app.signed.bin
          cat > /tmp/fw/Dockerfile <<'DOCKER'
          FROM scratch
          ADD app.signed.bin /
          ENTRYPOINT ["app.signed.bin"]
          DOCKER
          podman build -t mcu-fw:ci /tmp/fw

          ./target/release/runtt-mock --symlink /tmp/ci-tty &
          MOCK=$!
          for _ in $(seq 1 50); do [ -e /tmp/ci-tty ] && break; sleep 0.2; done
          PTS=$(readlink -f /tmp/ci-tty)

          set +e
          timeout 60 podman --runtime="$PWD/target/release/runtt" run --rm \
            --annotation dev.runtt.target="tty:$PTS" \
            mcu-fw:ci 2>&1 | tee /tmp/ci-run.log
          set -e
          kill $MOCK 2>/dev/null || true

          grep -q "image staged and marked test" /tmp/ci-run.log
          grep -q "image confirmed" /tmp/ci-run.log
          # Marking test must precede confirming: that ordering is the safety
          # property, so assert it rather than just that both happened.
          #
          # awk rather than `grep -n | head -1 | cut`, so there is no pipeline to
          # go wrong: head -1 closes the pipe on the first line and, under
          # pipefail, an upstream SIGPIPE would fail this step over nothing.
          staged=$(awk '/image staged and marked test/{print NR; exit}' /tmp/ci-run.log)
          confirmed=$(awk '/image confirmed/{print NR; exit}' /tmp/ci-run.log)
          echo "marked test at line $staged, confirmed at line $confirmed"
          test "$staged" -lt "$confirmed"
          ! grep -q "unsupported signal" /tmp/ci-run.log

  # ---------------------------------------------------------------------------
  # The firmware loop, headless.
  #
  # The Zephyr side lives in runtt-boards now, so this job assembles a workspace
  # from that repository's manifest and builds the fixtures itself. Two things
  # make that cheap: native_sim needs NO Zephyr SDK (it compiles with the host
  # toolchain), and the workspace caches.
  #
  # The alternative was having runtt-boards publish fixtures for this job to
  # download. That put two host executables on a release page whose readers want
  # to flash a board, and it coupled this repo's CI to another repo's release
  # cadence. Building them is simpler and pins by manifest revision instead.
  # ---------------------------------------------------------------------------
  native-sim:
    runs-on: ubuntu-24.04
    env:
      # Pin this to a runtt-boards tag once it has one. A branch means a change
      # over there can turn this red without anything changing here.
      RUNTT_BOARDS_REF: main
    steps:
      - name: Check out the runtime
        uses: actions/checkout@v4
        with:
          path: runtt

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtt

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install west and build tools
        run: |
          pip install --quiet west pyelftools cryptography intelhex click cbor2 jsonschema
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build device-tree-compiler

      - name: Cache the west workspace
        uses: actions/cache@v4
        with:
          path: |
            ws/zephyr
            ws/modules
            ws/bootloader
            ws/boards
            ws/.west
          key: west-${{ env.RUNTT_BOARDS_REF }}-${{ hashFiles('runtt/.github/workflows/ci.yml') }}

      - name: Assemble a firmware workspace from runtt-boards
        run: |
          mkdir -p ws && cd ws
          west init -m https://github.com/shaunmulligan/runtt-boards --mr "${RUNTT_BOARDS_REF}" \
            2>/dev/null || echo "already initialised"
          west update --narrow -o=--depth=1
          west list
          pip install --quiet -r zephyr/scripts/requirements-base.txt

      # No SDK step: native_sim builds with the host compiler.
      - name: Build the native_sim fixtures
        working-directory: ws/boards
        run: |
          ./scripts/build-native-sim.sh
          BUILD_DIR="$PWD/build-can" ./scripts/build-native-sim.sh \
            -DEXTRA_CONF_FILE="$PWD/bringup/native-sim-can.conf" \
            -DEXTRA_DTC_OVERLAY_FILE="$PWD/bringup/native-sim-can.overlay"

      - name: Build the runtime
        working-directory: runtt
        run: cargo build

      # RUNTT_REQUIRE_FIRMWARE is deliberately NOT set here: the firmware module
      # is not in this repository, so the three contract assertions that read it
      # skip. runtt-zephyr-module asserts them on its own side.
      - name: Tests
        working-directory: runtt
        run: cargo test --workspace

      - name: Phase-1 gate (runtime driven directly)
        working-directory: runtt
        env:
          SIM: ${{ github.workspace }}/ws/boards/build/zephyr/zephyr.exe
          MCUBOOT: ${{ github.workspace }}/ws/bootloader/mcuboot
        run: ./scripts/native-sim-e2e.sh

      - name: Phase-1 gate (full stack through podman)
        working-directory: runtt
        env:
          SIM: ${{ github.workspace }}/ws/boards/build/zephyr/zephyr.exe
          MCUBOOT: ${{ github.workspace }}/ws/bootloader/mcuboot
        run: ./scripts/native-sim-engine-e2e.sh

      # The CAN gate SKIPS without a bus, so the setup is a hard step: a silent
      # skip in CI would be worse than no job at all.
      # vcan is usually present on a GitHub runner; can-isotp often is not,
      # because it lives in linux-modules-extra rather than the base kernel
      # package. Install that first, then report per module rather than dying on
      # whichever modprobe happens to fail -- a bare "modprobe: FATAL" says
      # nothing about which of the two is missing.
      # SMP over CAN rides ISO-TP, which needs the can-isotp kernel module.
      # GitHub's hosted runners load vcan but NOT can-isotp -- that is what this
      # job first failed on, and it is a property of the runner image, not of
      # anything in this repository.
      #
      # So this reports precisely and skips visibly rather than doing either of
      # the two tempting things. Failing keeps CI permanently red over an
      # environment limitation; skipping quietly is worse, because a gate that
      # silently stops running looks exactly like a gate that passes. A step
      # summary line and a warning annotation are neither.
      #
      # End-to-end ISO-TP coverage therefore lives on the hardware path in
      # runtt-boards. To get it here instead, a self-hosted runner on a kernel
      # carrying can-isotp is all this needs -- the steps below are unchanged.
      - name: Set up a virtual CAN bus
        id: can
        run: |
          set -uo pipefail
          echo "kernel: $(uname -r)"
          sudo apt-get update -qq

          # Report apt's status. The first version of this swallowed it with
          # `|| echo note`, so when can-isotp turned out to be missing there was
          # no way to tell whether the package had failed to install or simply
          # does not carry the module. On generic kernels can-isotp ships in the
          # base linux-modules package; on the azure kernels these runners use it
          # is in linux-modules-extra, if it is there at all.
          pkg="linux-modules-extra-$(uname -r)"
          if sudo apt-get install -y -qq "$pkg"; then
            echo "installed $pkg"
          else
            rc=$?
            echo "apt could not install $pkg (exit $rc)"
            apt-cache policy "$pkg" 2>&1 | head -5 || true
          fi

          echo "--- CAN modules shipped for this kernel:"
          find "/lib/modules/$(uname -r)" \( -name 'can*' -o -name 'vcan*' \) 2>/dev/null | sort || true

          missing=""
          for m in vcan can-isotp; do
            if sudo modprobe "$m" 2>/dev/null; then echo "loaded  $m"
            else echo "MISSING $m"; missing="$missing $m"; fi
          done

          if [ -n "$missing" ]; then
            missing="${missing# }"          # built up with a leading space
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CAN gate SKIPPED: this runner's kernel has no $missing"
            {
              echo "### CAN gate skipped"
              echo
              echo "\`$(uname -r)\` has no **$missing**, so SMP over ISO-TP cannot run here."
              echo "This is a runner-image limitation. End-to-end CAN coverage runs on"
              echo "hardware in \`runtt-boards\`; a self-hosted runner with \`can-isotp\`"
              echo "would enable it in this workflow unchanged."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          sudo ip link add dev vcan0 type vcan
          sudo ip link set vcan0 up
          sudo ip link property add dev vcan0 altname zcan0   # native_sim hardcodes this
          ip -d link show vcan0
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "### CAN gate ran on a vcan bus" >> "$GITHUB_STEP_SUMMARY"

      - name: Phase-1 gate (SMP over CAN)
        if: steps.can.outputs.ready == 'true'
        working-directory: runtt
        env:
          SIM: ${{ github.workspace }}/ws/boards/build-can/zephyr/zephyr.exe
          MCUBOOT: ${{ github.workspace }}/ws/bootloader/mcuboot
        run: |
          set -o pipefail
          if ! ./scripts/native-sim-can-e2e.sh 2>&1 | tee /tmp/can-e2e.log; then
            echo "::error::the CAN gate ran and failed -- this is a real regression,"
            echo "::error::not the runner limitation the setup step reports on."
            grep -E "FAIL|error|not ok|skip" /tmp/can-e2e.log | head -8 \
              | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          # The script skips rather than fails when its preconditions are unmet.
          # Having got this far the bus exists, so a skip now means something else
          # is wrong and must not read as success.
          if grep -qi "^skip" /tmp/can-e2e.log; then
            echo "::error::the CAN gate skipped despite a working bus:"
            grep -i "^skip" /tmp/can-e2e.log | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

  mcuboot-sim:
    # The coverage native_sim structurally cannot give us. MCUboot's own Rust
    # simulator compiles the real bootutil C sources over a NOR flash model with
    # injectable failures, so swap/revert/confirm correctness -- including
    # interrupted-swap robustness -- is tested here instead.
    #
    # This job does not check out this repository: it tests MCUboot, not runtt.
    # It previously did, and then ran `west init` in the same directory, which is
    # what broke it.
    runs-on: ubuntu-24.04
    env:
      # Undo the workflow-level `-D warnings`. It is right for our own crates and
      # wrong here: this job compiles UPSTREAM MCUboot's simulator, and denying
      # warnings in code we do not own means any deprecation upstream picks up
      # fails our CI. It already did -- two `rand` deprecations in
      # sim/src/image.rs turned into hard errors and took the job down, while the
      # same build passes locally where RUSTFLAGS is unset.
      RUSTFLAGS: ""
      # Plain output: this job's failures are reported through ::error::
      # annotations, and ANSI colour codes make those unreadable.
      CARGO_TERM_COLOR: never
    steps:
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install west
        run: pip install --quiet west

      # Through runtt-boards' manifest, because that is what pins the MCUboot
      # revision. Cloning mcuboot directly is simpler and wrong: the simulator
      # would drift onto a different bootloader from the one the boards are built
      # against, and then pass or fail for reasons unrelated to what we ship.
      # Shares native-sim's cache: same manifest, same workspace, so whichever
      # job runs first populates it.
      - name: Cache the west workspace
        uses: actions/cache@v4
        with:
          path: |
            zephyr
            modules
            bootloader
            boards
            .west
          key: mcuboot-ws-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Fetch MCUboot at the revision runtt-boards pins
        run: |
          west init -m https://github.com/shaunmulligan/runtt-boards --mr main . \
            2>/dev/null || echo "already initialised"
          # A PLAIN update, not `west update mcuboot`. MCUboot arrives through the
          # manifest's `import:` rather than as a direct project, so west cannot
          # address it by name and says so:
          #   "one or more projects are unknown or defined via imports"
          # That is what broke this job.
          west update --narrow -o=--depth=1
          # west fetches the mcuboot repo but not its git submodules, and the
          # simulator links mbedtls from ext/. Only mbedtls: ext/tinycrypt is
          # vendored directly in the mcuboot tree rather than being a submodule,
          # and git accepts the extra pathspec silently, which made the command
          # read as though tinycrypt were coming from here too.
          git -C bootloader/mcuboot submodule update --init --depth 1 ext/mbedtls

      # Build and test as separate steps. `cargo test` returns 101 for both a
      # compile error and a failing test, so one step cannot say which happened
      # -- and downloading the log needs admin rights on the repository, so the
      # exit code was genuinely all there was to go on.
      #
      # Hence the tail-as-annotation in both: annotations ARE readable without
      # admin rights, so a failure here reports what went wrong rather than only
      # that something did. All 25 tests pass locally, so the first failure of
      # this job was environmental and this is how we find out how.
      # This exact build takes 9.5s from a clean workspace on the maintainer's
      # machine and failed on the runner, so the difference is the environment.
      # Record it rather than guess at it.
      - name: Toolchain versions
        working-directory: bootloader/mcuboot/sim
        run: |
          rustc --version; cargo --version
          echo "RUSTFLAGS=[${RUSTFLAGS-unset}]"
          cc --version | head -1
          python3 --version
          echo "--- submodule state the simulator links:"
          git -C .. submodule status ext/mbedtls || true
          echo "--- ext/tinycrypt present (vendored, not a submodule):"
          ls ../ext/tinycrypt | head -5 || echo "MISSING"

      - name: Build the simulator
        working-directory: bootloader/mcuboot/sim
        env:
          RUST_BACKTRACE: "1"
        run: |
          set -o pipefail
          if ! cargo build --tests --features sig-ecdsa 2>&1 | tee /tmp/sim-build.log; then
            echo "::error::the mcuboot simulator did not compile"
            # The tail minus progress noise, NOT a grep for expected patterns.
            # The first version grepped for ^error and friends, matched nothing,
            # and reported only that something had failed -- which is all the
            # exit code already said. GitHub keeps 10 error annotations per step,
            # so this is the header plus nine lines.
            { grep -vE "^[[:space:]]*(Compiling|Downloading|Downloaded|Updating|Fresh|Adding|Locking|Installing|Checking) " \
                /tmp/sim-build.log \
                | sed 's/\x1b\[[0-9;]*[a-zA-Z]//g' | tail -9 \
                | while IFS= read -r l; do echo "::error::${l:0:400}"; done; } || true
            exit 1
          fi

      # The slow tests are the point: perm_with_fails and revert_with_fails walk
      # every power-fail position through a swap. ~3 min on 18 cores locally, so
      # allow considerably more on a smaller runner.
      - name: Swap, revert and confirm under injected failures
        working-directory: bootloader/mcuboot/sim
        timeout-minutes: 45
        env:
          RUST_BACKTRACE: "1"
        run: |
          set -o pipefail
          if ! cargo test --features sig-ecdsa 2>&1 | tee /tmp/sim-test.log; then
            echo "::error::mcuboot swap/revert tests failed"
            { { grep -E "panicked|FAILED|^failures:|assertion" /tmp/sim-test.log || \
                grep -vE "^[[:space:]]*(Compiling|Downloading|Fresh) " /tmp/sim-test.log; } \
                | sed 's/\x1b\[[0-9;]*[a-zA-Z]//g' \
                | tail -9 | while IFS= read -r l; do echo "::error::${l:0:400}"; done; } || true
            exit 1
          fi
          grep -E "^test result:" /tmp/sim-test.log

  # ---------------------------------------------------------------------------
  # The install path. Until this existed, using runtt meant having a Rust
  # toolchain: the repo published nothing, so `runtt-boards` shipped provisioning
  # images for boards while the runtime that drives them shipped nowhere.
  #
  # Static musl, no cross toolchain. `rustup target add` plus rust-lld does the
  # whole job because the dependency set was chosen for it -- serialport is
  # `default-features = false` precisely to avoid the libudev-sys native dep, and
  # nothing else links C. That is a property worth protecting: adding a
  # dependency that needs libudev, libusb or openssl breaks this job, and this
  # job failing is the warning.
  #
  # Runs on every push, not just tags. Finding out at release time that the
  # cross-build broke is finding out too late.
  # ---------------------------------------------------------------------------
  binaries:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x86_64
            machine: Advanced Micro Devices X86-64
          - target: aarch64-unknown-linux-musl
            arch: aarch64
            machine: AArch64
          - target: armv7-unknown-linux-musleabihf
            arch: armv7hf
            machine: ARM
    env:
      # Repeated, not inherited. A job-level `env` REPLACES the workflow-level
      # one for the keys it names, so leaving out `-D warnings` here would
      # quietly drop the lint gate for these builds. (The mcuboot-sim job relies
      # on that same override in the other direction.)
      RUSTFLAGS: >-
        -D warnings
        -C linker=rust-lld
        -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust and the target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Echo the failure tail as annotations, the same as mcuboot-sim. Written
      # without it first, and the first failure of this job reported nothing but
      # "exit code 101" three times over -- while the actual cause was one line
      # naming a file. Log download needs admin rights on the repository;
      # annotations do not.
      - name: Build
        run: |
          set -o pipefail
          if ! cargo build --release --target ${{ matrix.target }} --bins 2>&1 \
               | tee /tmp/build.log; then
            echo "::error::cross-build for ${{ matrix.target }} failed"
            { grep -vE "^[[:space:]]*(Compiling|Downloading|Downloaded|Updating|Fresh|Adding|Locking) " \
                /tmp/build.log \
                | sed 's/\x1b\[[0-9;]*[a-zA-Z]//g' | tail -9 \
                | while IFS= read -r l; do echo "::error::${l:0:400}"; done; } || true
            exit 1
          fi

      # Check the ARTEFACT. A cross-build that silently produced a dynamically
      # linked binary, or one for the wrong architecture, would publish
      # something that cannot run on the device it is named for -- and nobody
      # would find out until they tried it on a board.
      #
      # The test is "has no PT_INTERP segment", i.e. names no dynamic loader,
      # because that is architecture-independent. Do NOT grep `file` for
      # "statically linked": the x86_64 build is a static-PIE and reports
      # "static-pie linked" instead, so that check passes on two targets and
      # fails on the third.
      - name: The binaries are static and the right architecture
        run: |
          set -euo pipefail
          mkdir -p dist
          for b in runtt runtt-mock; do
            p="target/${{ matrix.target }}/release/$b"
            [ -f "$p" ] || { echo "::error::$p was not built"; exit 1; }

            interp=$(readelf -l "$p" | grep -c INTERP || true)
            if [ "$interp" -ne 0 ]; then
              echo "::error::$b for ${{ matrix.target }} is dynamically linked"
              readelf -l "$p" | grep -A2 INTERP
              exit 1
            fi

            machine=$(readelf -h "$p" | sed -n 's/^ *Machine: *//p')
            if [ "$machine" != "${{ matrix.machine }}" ]; then
              echo "::error::$b is for '$machine', expected '${{ matrix.machine }}'"
              exit 1
            fi

            echo "  $b: static, $machine, $(stat -c %s "$p") bytes"

            # Both binaries are BUILT and checked here -- the mock's cross-build
            # is worth gating, and the podman smoke test in `test` uses it -- but
            # only the runtime is published. runtt-mock is useful only to someone
            # who already has a checkout: every doc that drives it (the README's
            # no-hardware section, and the by-hand procedures in NOTES.md)
            # invokes ./target/debug/runtt-mock. Attaching it put three assets on
            # the release page that nothing there explained.
            # NOT `[ "$b" = runtt ] && cp ...`: this loop is the last statement
            # in the step, so the step's exit status is the last command's, and
            # a false test on the runtt-mock iteration fails the whole job under
            # `set -e`. Verified -- it exits 1.
            if [ "$b" = runtt ]; then
              cp "$p" "dist/$b-${{ matrix.arch }}"
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ci-binaries-${{ matrix.arch }}
          path: dist/*
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Tag-gated, like runtt-boards': a push to main publishes nothing, and the
  # assets appear when a version tag is pushed.
  #
  # Individual binaries rather than one tarball, for the same reason the board
  # images are individual files: someone provisioning an aarch64 device wants one
  # download, not an archive holding two architectures they cannot run.
  # ---------------------------------------------------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, native-sim, mcuboot-sim, binaries]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-binaries-*
          merge-multiple: true
          path: dist

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ( cd dist && sha256sum runtt-* > SHA256SUMS )
          ls -la dist
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Static Linux binaries for the runtt OCI runtime, built from \`${GITHUB_SHA}\`.

          | Architecture | Download | Typical device |
          |---|---|---|
          | x86_64 | \`runtt-x86_64\` | an x86 host or SBC |
          | aarch64 | \`runtt-aarch64\` | Raspberry Pi 3/4/5, Jetson |
          | armv7hf | \`runtt-armv7hf\` | Raspberry Pi 2/3 on a 32-bit OS |

          No dependencies: each is statically linked against musl, so there is no
          libc, libudev or glibc version to match on the device.

          \`\`\`bash
          curl -LO https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/runtt-aarch64
          chmod +x runtt-aarch64 && sudo mv runtt-aarch64 /usr/local/bin/runtt
          \`\`\`

          Then run a firmware container with **podman**, which takes the runtime as
          a path and needs no daemon configuration:

          \`\`\`bash
          podman run --rm --network none --runtime=/usr/local/bin/runtt \\
            --annotation dev.runtt.target=usb:my-board-01 my-firmware:v1
          \`\`\`

          For Docker the runtime has to be registered with the daemon first --
          \`scripts/register-docker.sh\` in this repository -- after which
          \`--runtime=runtt\` resolves by name.

          Verify what you downloaded against \`SHA256SUMS\`.

          Provisioning images for the boards themselves live in
          [runtt-boards](https://github.com/shaunmulligan/runtt-boards/releases).
          " \
            dist/* || gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
