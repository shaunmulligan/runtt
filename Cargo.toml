[workspace]
resolver = "2"
members = [
    "crates/mcu-runtime",
    "crates/smp-client",
    "crates/transport",
    "crates/smp-mock",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/balena-os/mcu-runtime"

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
libc = "0.2.189"
liboci-cli = "0.7.0"
nix = { version = "0.31.3", features = ["process", "signal", "term", "fs"] }
oci-spec = "0.10.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# default-features off: avoids the libudev-sys native dep. Port enumeration and
# hotplug come from reading sysfs / a netlink monitor directly.
serialport = { version = "4.10.0", default-features = false }
sha2 = "0.11.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

# Pinned exactly: young crate, single maintainer. See docs/WIRE_CONTRACT.md.
mcumgr-toolkit = "=0.16.0"
