[workspace]
resolver = "2"
members = [
    "crates/runtt",
    "crates/runtt-smp",
    "crates/runtt-transport",
    "crates/runtt-mock",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/shaunmulligan/runtt"

[workspace.dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
ciborium = "0.2.2"
crc = "3.4.0"
clap = { version = "4.6.6", features = ["derive"] }
libc = "0.2.189"
liboci-cli = "0.7.0"
nix = { version = "0.31.3", features = ["process", "signal", "term", "fs"] }
oci-spec = "0.10.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# default-features off: avoids the libudev-sys native dep. Port enumeration and
# hotplug come from reading sysfs / a netlink monitor directly.
serialport = { version = "4.10.0", default-features = false }
sha2 = "0.11.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

# Pinned exactly: young crate, single maintainer. See docs/WIRE_CONTRACT.md.
mcumgr-toolkit = "=0.16.0"

[patch.crates-io]
# One addition upstream does not have yet: MCUmgrClient::new_from_transport, plus
# the two public constants a Transport impl needs to name its own parameter types.
# Without them a Transport living outside the crate -- ours is SMP over ISO-TP on
# CAN -- cannot be handed to a client at all.
#
# Submitted upstream as Finomnis/mcumgr-toolkit#186.
# Pinned to a REV rather than a branch: the branch will move as review feedback
# lands, and we want to choose when to take it rather than have a rebase upstream
# silently change what we build.
#
# NOTE: while this git dependency exists, `cargo publish` is impossible -- crates.io
# requires every dependency to itself be on crates.io. Dropping back to a released
# version is the last step before publishing. See docs/FORKED_DEPENDENCY.md.
mcumgr-toolkit = { git = "https://github.com/shaunmulligan/mcumgr-toolkit", rev = "6595f7e4fcadec5c1d02dd70072dc16e3176e253" }

[profile.release]
# Strip in the compiler rather than with binutils afterwards. Release artefacts
# are cross-compiled for armv7 and aarch64, and the host's `strip` cannot handle
# those -- it silently leaves the symbols in place. Doing it here is
# toolchain-independent and works identically for every target.
strip = "symbols"
