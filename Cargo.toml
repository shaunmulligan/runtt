[workspace]
resolver = "2"
members = [
    "crates/runtt",
    "crates/runtt-smp",
    "crates/runtt-transport",
    "crates/runtt-mock",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/balena-os/runtt"

[workspace.dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
ciborium = "0.2.2"
crc = "3.4.0"
clap = { version = "4.6.6", features = ["derive"] }
libc = "0.2.189"
liboci-cli = "0.7.0"
nix = { version = "0.31.3", features = ["process", "signal", "term", "fs"] }
oci-spec = "0.10.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# default-features off: avoids the libudev-sys native dep. Port enumeration and
# hotplug come from reading sysfs / a netlink monitor directly.
serialport = { version = "4.10.0", default-features = false }
sha2 = "0.11.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

# Pinned exactly: young crate, single maintainer. See docs/WIRE_CONTRACT.md.
mcumgr-toolkit = "=0.16.0"

# Vendored so we can carry ONE addition: MCUmgrClient::new_from_transport.
#
# Every upstream constructor is tied to a concrete transport type and the
# client's connection field is private, so a Transport implementation living
# outside the crate -- ours is SMP over ISO-TP on CAN -- cannot be handed to a
# client at all. Connection::new is already public and generic; the patch just
# exposes the same thing one level up.
#
# The diff is one import and one method. It is submitted upstream as
# docs/UPSTREAM_MCUMGR_TOOLKIT.md; delete this block and the vendored tree once
# it lands in a release.
[patch.crates-io]
mcumgr-toolkit = { path = "third_party/mcumgr-toolkit" }
